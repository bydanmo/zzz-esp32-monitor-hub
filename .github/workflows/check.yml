name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web-and-hub:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: python tools/testing/audit-public.py
      - run: node tools/testing/check-study-bootstrap.mjs
